<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片重建</title><link rel="stylesheet" href="/mobile/style.css"></head><body><main><header><h1>照片重建</h1><p>连接工作台，上传照片并创建模型。</p></header><p id="message" role="status" aria-live="polite"></p><section id="pairSection"><h2>1. 配对设备</h2><form id="pairForm"><label>配对码<input id="code" required inputmode="numeric" autocomplete="one-time-code"></label><label>设备名称<input id="device" required maxlength="100" value="手机浏览器"></label><button>配对</button></form></section><section id="createSection" hidden><h2>2. 创建照片批次</h2><form id="createForm"><label>项目名称<input id="name" required maxlength="100" value="照片项目"></label><label>训练档位<select id="preset"><option value="standard">标准</option><option value="fast">快速</option><option value="full">完整</option></select></label><button>创建批次</button></form><p id="limits"></p><label>已保存的批次<select id="sessions"><option value="">选择批次</option></select></label></section><section id="batchSection" hidden><h2>3. 上传照片</h2><p id="batchInfo"></p><p>如果不能打开相机，请先拍照，再从相册选择。原始照片不会被压缩。</p><div class="actions"><label class="button">拍照<input id="camera" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" capture="environment"></label><label class="button">选择相册<input id="gallery" type="file" accept=".jpg,.jpeg,.png" multiple></label></div><p id="formatNote"></p><p id="uploadProgress" role="status" aria-live="polite"></p><p id="reselect"></p><ul id="queued"></ul><button id="retryQueue" hidden>继续上传待处理照片</button><ul id="files"></ul><button id="commit">提交照片并创建项目</button></section><section id="projectSection" hidden><h2>4. 重建与查看</h2><p id="projectInfo"></p><button id="run">开始重建</button> <a id="viewer" class="button" hidden>打开模型</a><p id="progress"></p><p id="timing"></p><p id="quality"></p><ul id="steps"></ul></section></main><script type="module" src="/mobile/app.js"></script></body></html>
