<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>室内三维漫游 · 本地场景</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  canvas { display: block; touch-action: none; }
  .hud {
    position: fixed; left: 14px; top: 14px; z-index: 2; max-width: 330px;
    background: rgba(18, 24, 33, .82); color: #e6edf3; border: 1px solid #2b3a4d;
    border-radius: 10px; padding: 14px 16px; font: 13px/1.7 "Microsoft YaHei", system-ui, sans-serif;
  }
  .hud h1 { font-size: 15px; margin: 0 0 8px; }
  .hud p { margin: 4px 0; color: #9fb0c3; }
  .hud kbd {
    background: #24303f; border: 1px solid #3a4c60; border-radius: 4px;
    padding: 0 5px; font-size: 12px; color: #d7e3ef;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  button {
    background: #1f6feb; color: #fff; border: 0; border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #388bfd; }
  input[type=range] { width: 120px; }
  #status { margin-top: 10px; color: #7d8fa3; font-size: 12px; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #c9d5e2; font: 15px/1.8 "Microsoft YaHei", system-ui, sans-serif;
    z-index: 3; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<div id="loading">正在加载三维场景…<br><span id="loadingDetail">准备中</span></div>

<div class="hud">
  <h1>室内三维漫游</h1>
  <p>鼠标右键拖动：360° 旋转（左右不限，上下到头为止）</p>
  <p>鼠标左键拖动：平移　滚轮：缩放（拉远可见整体模型）</p>
  <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</p>
  <div class="row">
    <button id="reset">重置视角</button>
    <label><input id="cutToggle" type="checkbox"> 切开顶部</label>
  </div>
  <div class="row">
    <label><input id="cropToggle" type="checkbox" checked> 只显示房间范围</label>
  </div>
  <div class="row">
    <label>切面高度 <input id="cutHeight" type="range" min="0" max="1" step="0.001" value="0.7"></label>
    <span id="cutValue">—</span>
  </div>
  <div id="status">等待场景…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/postprocessing/Pass.js": "./vendor/three/examples/jsm/postprocessing/Pass.js",
    "@sparkjsdev/spark": "./vendor/spark.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh, SplatEdit, SplatEditSdf } from "@sparkjsdev/spark";

const loading = document.getElementById("loading");
const loadingDetail = document.getElementById("loadingDetail");
const status = document.getElementById("status");

function fail(message) {
  loading.style.display = "flex";
  loadingDetail.textContent = message;
  status.textContent = "加载失败";
}

const scene = new THREE.Scene();
const HOME_FOV = 65;   // 固定视场角：滚轮改的是距离，不再改 fov
const camera = new THREE.PerspectiveCamera(HOME_FOV, innerWidth / innerHeight, 0.02, 400);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);
// 拉远时画面会被「巨型针状泼溅」糊白：3DGS 训练会产出少数尺度极大的高斯
// （本项目最大 221 单位，房间本体才 16），Spark 默认允许单个泼溅画到
// 512px 半径 = 1024px 直径，几千个叠起来就是整屏白雾加放射状白线。
// 所以把屏幕半径上限压下来。实测（1280×900，拉远到 23.7）：
//   cap 512 → 平均亮度 78.4、亮像素 15.9%；cap 32 → 20.9 / 6.5%；cap 16 → 15.2 / 5.0%
// 但太小会让巨型泼溅变成满屏麻点，所以取 32。
// minAlpha 只做兜底（默认 ≈0.00196，提到 0.005 只丢约 0.3% 的泼溅）。
const spark = new SparkRenderer({
  renderer,
  maxPixelRadius: 32,
  minAlpha: 0.005,
});
scene.add(spark);

// Scene URL comes from ?scene=... so the workbench can point at any project's export.
const sceneUrl = new URLSearchParams(location.search).get("scene") || "/scene.ply";
const splat = new SplatMesh({ url: sceneUrl, paged: false });
scene.add(splat);

// The reconstruction frame is arbitrary, and COLMAP anchors it on the first image
// whose +Y is image-down — so the scene often arrives upside down for a Y-up viewer.
// The workbench passes an orthonormal basis (rows e_x, e_y, e_z) that re-expresses
// reconstruction coordinates as Y-up; rotate the splat into that frame so all the
// camera and movement maths below can keep assuming Y is up.
const basisParam = (new URLSearchParams(location.search).get("basis") || "").split(",").map(Number);
const hasBasis = basisParam.length === 9 && basisParam.every(Number.isFinite);
function applySceneBasis() {
  if (!hasBasis) return;
  const matrix = new THREE.Matrix4().set(
    basisParam[0], basisParam[1], basisParam[2], 0,
    basisParam[3], basisParam[4], basisParam[5], 0,
    basisParam[6], basisParam[7], basisParam[8], 0,
    0, 0, 0, 1,
  );
  splat.quaternion.setFromRotationMatrix(matrix);
}
applySceneBasis();

// Scene units come from the reconstruction (metres); Y is up in the export.
// The workbench passes ?home=x,y,z,yaw,pitch derived from the camera trajectory,
// because the reconstruction frame is arbitrary and a fixed pose would face the
// wrong way. Falls back to the old defaults when absent.
const homeParam = (new URLSearchParams(location.search).get("home") || "").split(",").map(Number);
const hasHome = homeParam.length === 5 && homeParam.every(Number.isFinite);
const home = {
  position: hasHome ? new THREE.Vector3(homeParam[0], homeParam[1], homeParam[2]) : new THREE.Vector3(0, 1.5, 0),
  yaw: hasHome ? homeParam[3] : 0,
  pitch: hasHome ? homeParam[4] : 0,
  fov: HOME_FOV,
};
// 轨道相机：绕 target 旋转、按 distance 拉近拉远。target 放在视线前方，
// 所以初始观感仍是「站在原地环视」，拉远后它又近似场景中心，可以环看整个模型。
let yaw = home.yaw;
let pitch = home.pitch;
let distance = 2;        // 相机到 target 的距离（模型单位）
let sceneRadius = 4;     // 场景尺度：优先 ?radius=（相机轨迹半径），其次高斯点包围盒
let maxDistance = 20;    // 拉远上限；保证一定能拉到看见整体
const target = new THREE.Vector3();
const forward = new THREE.Vector3();
const panRight = new THREE.Vector3();
const panUp = new THREE.Vector3();
const rotation = new THREE.Euler(0, 0, 0, "YXZ");
const move = new THREE.Vector3();
const yawOnly = new THREE.Quaternion();
const up = new THREE.Vector3(0, 1, 0);
const keys = new Set();
const canvas = renderer.domElement;
const PIVOT_DISTANCE = 2;          // 初始支点距离：视线前方 2 个模型单位
const ORBIT_SENSITIVITY = 0.004;   // 弧度 / 像素
const PITCH_LIMIT = 1.5;           // 上下限约 86°，防止万向节翻转；左右不夹紧，可转满 360°
const ZOOM_STEP = 1.15;            // 每格滚轮缩放 15%
const MIN_DISTANCE = 0.1;
const MOVE_SPEED = 1.6;            // 模型单位 / 秒，固定速度

/** 相机朝向，与 Euler(pitch, yaw, 0) 的局部 -Z 一致。 */
function forwardVector() {
  const horizontal = Math.cos(pitch);
  return forward.set(-Math.sin(yaw) * horizontal, Math.sin(pitch), -Math.cos(yaw) * horizontal);
}

/** 由 yaw / pitch / distance / target 反推相机位置与朝向。 */
function updateCamera() {
  camera.quaternion.setFromEuler(rotation.set(pitch, yaw, 0));
  camera.position.copy(target).addScaledVector(forwardVector(), -distance);
}

function reset() {
  keys.clear();
  camera.fov = home.fov;
  camera.updateProjectionMatrix();
  yaw = home.yaw;
  pitch = home.pitch;
  distance = PIVOT_DISTANCE;
  target.copy(home.position).addScaledVector(forwardVector(), distance);
  updateCamera();
}

// 先按 URL 里的尺度定好缩放上限，再摆初始机位（场景加载失败也不影响）。
updateSceneScale();
document.getElementById("reset").onclick = reset;
reset();

// 切开顶部：用 SplatEdit + 平面 SDF 把「世界 Y 之上」的泼溅 alpha 乘 0（等效删除）。
// 编辑在直立系世界坐标求值（先对象→世界变换，再应用编辑），所以平面就是水平面。
// 用 splat.edits 而不是挂子节点：子节点会继承 basis 旋转，切割面就歪了。
const cutEdit = new SplatEdit({ name: "cut-top", rgbaBlendMode: "multiply" });
const cutPlane = new SplatEditSdf({ type: "plane", opacity: 0 });
cutPlane.rotation.x = Math.PI / 2;   // 局部 +Z → 世界 −Y，于是 distance<0 恰好是 y > 切面高度
cutEdit.sdfs = [cutPlane];

// 漂浮点裁剪：3DGS 会产出少数远离场景的巨型高斯（本项目最远 66 单位、房间本体 16）。
// 用倒置球 SDF 把「相机轨迹尺度之外」的一切挡掉——纯渲染侧，不动数据。
// 实测到 home 的距离 p99.5 = 1.11×尺度，所以 1.2× 只切掉 0.26% 的泼溅。
const CROP_FACTOR = 1.2;
const cropEdit = new SplatEdit({ name: "room-crop", rgbaBlendMode: "multiply", softEdge: 0 });
const cropSphere = new SplatEditSdf({ type: "sphere", opacity: 0, invert: true });
cropEdit.sdfs = [cropSphere];

// 默认切面高度按实测标定：世界系 Y 的 p95 ≈ home.y + 0.12×尺度（p99 为 +0.19×）。
// 不要用 splat.getBoundingBox()——那是重建局部系，且被 Y 最高 +47.7 的漂浮点撑大。
const CUT_DEFAULT_FACTOR = 0.15;
const CUT_RANGE_FACTOR = 0.6;
const cutToggle = document.getElementById("cutToggle");
const cropToggle = document.getElementById("cropToggle");
const cutSlider = document.getElementById("cutHeight");
let cutHeight = home.position.y + CUT_DEFAULT_FACTOR * sceneRadius;
let cutTouched = false;

function cutRange() {
  const span = CUT_RANGE_FACTOR * sceneRadius;
  return [home.position.y - span, home.position.y + span];
}

/** 两个编辑都靠 splat.edits 挂载；一旦非空 Spark 就不再遍历子节点。 */
function syncEdits() {
  const edits = [];
  if (cropToggle.checked) edits.push(cropEdit);
  if (cutToggle.checked) edits.push(cutEdit);
  splat.edits = edits.length ? edits : null;
}

/** 把 cutHeight 同步到平面与滑块（滑块是 [0,1] 的归一化位置）。 */
function applyCutHeight() {
  cutPlane.position.set(0, cutHeight, 0);
  cutPlane.updateMatrixWorld(true);
  document.getElementById("cutValue").textContent = cutHeight.toFixed(2);
  const [low, high] = cutRange();
  cutSlider.value = String((cutHeight - low) / (high - low));
}

/** 裁剪球半径与切面高度都随场景尺度走。 */
function applySceneScaleToEdits() {
  cropSphere.radius = CROP_FACTOR * sceneRadius;
  cropSphere.position.copy(home.position);
  cropSphere.updateMatrixWorld(true);
}

cutSlider.oninput = () => {
  const [low, high] = cutRange();
  cutTouched = true;
  cutHeight = low + (high - low) * Number(cutSlider.value);
  applyCutHeight();
};
cutToggle.onchange = syncEdits;
cropToggle.onchange = syncEdits;
applyCutHeight();
applySceneScaleToEdits();
syncEdits();

addEventListener("keydown", (event) => {
  if (["KeyW", "KeyA", "KeyS", "KeyD"].includes(event.code)) {
    event.preventDefault();
    keys.add(event.code);
  }
});
addEventListener("keyup", (event) => keys.delete(event.code));
addEventListener("blur", () => keys.clear());

let dragId = null;
let dragButton = -1;

/** 右键：yaw 与 pitch 同时改，所以上下左右都能转。 */
function orbit(dx, dy) {
  yaw -= dx * ORBIT_SENSITIVITY;
  pitch = THREE.MathUtils.clamp(pitch - dy * ORBIT_SENSITIVITY, -PITCH_LIMIT, PITCH_LIMIT);
  updateCamera();
}

/** 左键：相机与 target 一起在屏幕平面内平移；位移随距离缩放，保证跟手。 */
function pan(dx, dy) {
  const perPixel = 2 * distance * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / canvas.clientHeight;
  panRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
  panUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  target.addScaledVector(panRight, -dx * perPixel).addScaledVector(panUp, dy * perPixel);
  updateCamera();
}

canvas.addEventListener("pointerdown", (event) => {
  // 左键(0) 平移，右键(2) 360° 旋转；其余按键忽略。
  if (event.button !== 0 && event.button !== 2) return;
  dragId = event.pointerId;
  dragButton = event.button;
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", (event) => {
  if (event.pointerId !== dragId) return;
  if (dragButton === 0) pan(event.movementX, event.movementY);
  else if (dragButton === 2) orbit(event.movementX, event.movementY);
});
function endDrag() {
  dragId = null;
  dragButton = -1;
}
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
  canvas.addEventListener(type, endDrag);
}

// 右键要用于旋转，必须阻止浏览器右键菜单。
canvas.addEventListener("contextmenu", (event) => event.preventDefault());

// 滚轮缩放：改相机到 target 的距离。拉到 maxDistance 时整个模型都在视野内。
// passive:false 才允许 preventDefault 阻止页面滚动。
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const factor = event.deltaY > 0 ? ZOOM_STEP : 1 / ZOOM_STEP;
  distance = THREE.MathUtils.clamp(distance * factor, MIN_DISTANCE, maxDistance);
  updateCamera();
}, { passive: false });

// 自动化验证钩子：仅在 ?debug=1 时暴露只读状态，正常使用完全无感。
if (new URLSearchParams(location.search).get("debug") === "1") {
  window.__viewerDebug = {
    get yaw() { return yaw; },
    get pitch() { return pitch; },
    get fov() { return camera.fov; },
    get position() { return camera.position.toArray(); },
    get distance() { return distance; },
    get target() { return target.toArray(); },
    get sceneRadius() { return sceneRadius; },
    get maxDistance() { return maxDistance; },
    get maxPixelRadius() { return spark.maxPixelRadius; },
    get minAlpha() { return spark.minAlpha; },
    get cutEnabled() { return Array.isArray(splat.edits) && splat.edits.includes(cutEdit); },
    get cutHeight() { return cutPlane.position.y; },
    get cutPlaneDirection() { return new THREE.Vector3(0, 0, 1).applyQuaternion(cutPlane.quaternion).toArray(); },
    get cropEnabled() { return Array.isArray(splat.edits) && splat.edits.includes(cropEdit); },
    get cropRadius() { return cropSphere.radius; },
    get editsCount() { return Array.isArray(splat.edits) ? splat.edits.length : 0; },
    setMaxPixelRadius(value) { spark.maxPixelRadius = value; },
    get sceneQuaternion() { return splat.quaternion.toArray(); },
  };
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

/** 场景尺度决定拉远上限。优先用工作台传的相机轨迹尺度（?radius=），
 *  没有时退回高斯点的包围盒——但 3DGS 常有远处漂浮点，包围盒会被撑大。 */
function updateSceneScale() {
  const fromUrl = Number(new URLSearchParams(location.search).get("radius"));
  if (Number.isFinite(fromUrl) && fromUrl > 0) return setSceneRadius(fromUrl);

  let box;
  try { box = splat.getBoundingBox(); } catch { return; }
  if (!box || box.isEmpty()) return;
  const radius = box.getBoundingSphere(new THREE.Sphere()).radius;
  if (!Number.isFinite(radius) || radius <= 0) return;
  setSceneRadius(radius);
}

function setSceneRadius(radius) {
  sceneRadius = radius;
  maxDistance = Math.max(radius * 3, 20);   // 拉到上限时模型整体必然在视野内
  camera.far = Math.max(400, maxDistance * 1.5);
  camera.updateProjectionMatrix();
}

try {
  const timeout = new Promise((_, reject) =>
    setTimeout(() => reject(new Error("场景初始化超时（60 秒）")), 60000));
  await Promise.race([splat.initialized, timeout]);
  applySceneBasis();   // 再设一次，避免 Spark 在加载过程中重置网格变换
  updateSceneScale();  // ?radius= 缺失时改用实测包围盒；两者都不改当前机位
  // 尺度若刚刚才定下来，重算默认切面高度与裁剪球（用户已经拖过滑块就不动切面）。
  if (!cutTouched) {
    cutHeight = home.position.y + CUT_DEFAULT_FACTOR * sceneRadius;
    applyCutHeight();
  }
  applySceneScaleToEdits();
  loading.style.display = "none";
  status.textContent = "场景已就绪 · 本地加载";
} catch (error) {
  fail("加载失败：" + error.message);
  throw error;
}

let previous = performance.now();
renderer.setAnimationLoop((time) => {
  const delta = Math.min((time - previous) / 1000, 0.05);
  previous = time;

  move.set(
    Number(keys.has("KeyD")) - Number(keys.has("KeyA")),
    0,
    Number(keys.has("KeyS")) - Number(keys.has("KeyW")),
  );
  if (move.lengthSq() > 0) {
    // WASD 把相机与支点一起平移，速度固定（不再有加速 / 减速）。
    yawOnly.setFromAxisAngle(up, yaw);
    move.normalize().applyQuaternion(yawOnly);
    target.addScaledVector(move, delta * MOVE_SPEED);
    updateCamera();
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
